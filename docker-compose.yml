version: '3.9'

services:
  api:
    build:
      context: .
      target: builder
    command: npm run start:dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: dev-secret-change-in-prod
      JWT_EXPIRATION: 7d
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: orderease
      DB_PASSWORD: orderease
      DB_DATABASE: orderease
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID:-price_placeholder}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderease
      POSTGRES_PASSWORD: orderease
      POSTGRES_DB: orderease
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orderease']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
